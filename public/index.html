<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bookove — Your Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="css/style.css" />
<script>if(localStorage.getItem('bookove-theme')==='dark'||(!localStorage.getItem('bookove-theme')&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')</script>
</head>
<body>

<!-- Comic burst decorations -->
<div class="comic-burst comic-burst-1" aria-hidden="true"></div>
<div class="comic-burst comic-burst-2" aria-hidden="true"></div>
<div class="halftone-dots" aria-hidden="true"></div>

<!-- Comic background slideshow -->
<div class="comic-slideshow" aria-hidden="true">
  <div class="comic-slideshow-slide" style="background: linear-gradient(135deg, rgba(255,215,0,0.08) 0%, rgba(255,77,77,0.05) 100%);"></div>
  <div class="comic-slideshow-slide" style="background: linear-gradient(225deg, rgba(255,102,204,0.08) 0%, rgba(153,102,255,0.05) 100%);"></div>
  <div class="comic-slideshow-slide" style="background: linear-gradient(315deg, rgba(0,204,102,0.08) 0%, rgba(0,204,204,0.05) 100%);"></div>
</div>

<header class="site-header">
  <a href="index.html" class="wordmark"><img src="images/logo.png" alt="Bookove" class="logo-img" /></a>

  <div class="header-search">
    <input type="text" id="search-input" placeholder="Search books…" aria-label="Search books" />
    <select id="format-filter" aria-label="Filter by format">
      <option value="">All Formats</option>
      <option value="pdf">PDF</option>
      <option value="epub">EPUB</option>
      <option value="txt">TXT</option>
      <option value="mobi">MOBI</option>
    </select>
    <select id="genre-filter" aria-label="Filter by genre">
      <option value="">All Genres</option>
      <option value="kids">Kids</option>
      <option value="educational">Educational</option>
      <option value="devotional">Devotional</option>
      <option value="conspiracy">Conspiracy</option>
      <option value="sci-fi">Sci-Fi</option>
      <option value="novel">Novel</option>
      <option value="self-help">Self-Help</option>
      <option value="fantasy">Fantasy</option>
      <option value="horror">Horror</option>
      <option value="romance">Romance</option>
      <option value="mystery">Mystery</option>
      <option value="biography">Biography</option>
      <option value="history">History</option>
      <option value="philosophy">Philosophy</option>
      <option value="technology">Technology</option>
      <option value="comics">Comics</option>
      <option value="poetry">Poetry</option>
      <option value="other">Other</option>
    </select>
    <select id="language-filter" aria-label="Filter by language">
      <option value="">All Languages</option>
      <option value="English">English</option>
      <option value="Hindi">Hindi</option>
      <option value="Spanish">Spanish</option>
      <option value="French">French</option>
      <option value="German">German</option>
      <option value="Chinese">Chinese</option>
      <option value="Japanese">Japanese</option>
      <option value="Portuguese">Portuguese</option>
      <option value="Russian">Russian</option>
      <option value="Arabic">Arabic</option>
      <option value="Korean">Korean</option>
      <option value="Italian">Italian</option>
      <option value="Other">Other</option>
    </select>
    <select id="sort-filter" aria-label="Sort books">
      <option value="">Latest</option>
      <option value="trending">🔥 Trending</option>
      <option value="hidden-gems">💎 Hidden Gems</option>
    </select>
  </div>

  <nav class="site-nav" id="site-nav">
    <a href="upload.html">Upload</a>
  </nav>

  <!-- Mobile actions: + upload, profile circle, three-dot menu -->
  <div class="mobile-menu-wrap">
    <a href="upload.html" class="mobile-upload-btn" aria-label="Upload">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </a>
    <div class="mobile-profile-slot" id="mobile-profile-slot" aria-label="Profile"></div>
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
    </button>
    <div class="mobile-dropdown" id="mobile-dropdown">
      <button class="mobile-dropdown-item" id="mobile-theme-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span id="mobile-theme-label">Dark Mode</span>
      </button>    </div>
  </div>
</header>

<!-- Trending ribbon -->
<div class="trending-ribbon" id="trending-ribbon">
  <span class="trending-ribbon-label">🔥 TRENDING</span>
  <div class="trending-ribbon-track" id="trending-track"></div>
</div>

<!-- Tab bar: Shelf / For You / Highly Rated -->
<div class="shelf-tabs">
  <button class="shelf-tab active" data-tab="shelf">📚 Shelf</button>
  <button class="shelf-tab" data-tab="recommended">✨ For You</button>
  <button class="shelf-tab" data-tab="highly-rated">⭐ Highly Rated</button>
</div>

<main class="book-grid" id="shelves">
  <p class="empty-state">Loading the shelf…</p>
</main>

<main class="book-grid" id="recommended-grid" style="display:none;">
  <p class="empty-state">Loading recommendations…</p>
</main>

<main class="book-grid" id="highly-rated-grid" style="display:none;">
  <p class="empty-state">Loading highly rated books…</p>
</main>

<!-- Bottom navigation (mobile) -->
<nav class="bottom-nav">
  <a href="index.html" class="bottom-nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Shelf
  </a>
  <a href="upload.html" class="bottom-nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Upload
  </a>
  <button class="bottom-nav-item" id="mobile-theme-toggle" style="background:none;border:none;cursor:pointer;">
    <svg id="mobile-theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    Theme
  </button>
</nav>

<script src="js/profile-card.js"></script>
<script src="js/auth-nav.js"></script>
<script src="js/theme-toggle.js"></script>
<script src="js/mobile-menu.js"></script>
<script src="js/app.js"></script>
<script src="js/audio-helper.js"></script>
</body>
</html>
