<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get a library card — Bookove</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="css/style.css" />
<script>if(localStorage.getItem('bookove-theme')==='dark'||(!localStorage.getItem('bookove-theme')&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')</script>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="wordmark"><img src="images/logo.png" alt="Bookove" class="logo-img" /></a>
  <nav class="site-nav" id="site-nav">
    <a href="upload.html">Upload</a>
  </nav>
</header>

<div class="card-page">
  <div class="library-card">
    <div class="eyebrow">New member</div>
    <h1>Get your library card</h1>
    <p class="lede">
      Anyone can browse and read for free. A card just means when you add a
      book, people can see who actually put it on the shelf.
    </p>

    <div id="auth-error" class="auth-error" style="display:none;"></div>

    <form id="register-form" enctype="multipart/form-data">
      <div class="field">
        <label for="reg-username">Username *</label>
        <input type="text" id="reg-username" name="username" required placeholder="e.g. read_lover" />
      </div>

      <div class="field">
        <label for="reg-password">Password *</label>
        <input type="password" id="reg-password" name="password" required placeholder="••••••••" />
      </div>

      <div class="field">
        <label for="reg-email">Email (for recovery) *</label>
        <input type="email" id="reg-email" name="email" required placeholder="your@email.com" />
      </div>

      <div class="field-row" style="display: flex; gap: 10px;">
        <div class="field" style="flex: 1;">
          <label for="reg-age">Age</label>
          <input type="number" id="reg-age" name="age" min="1" max="120" placeholder="24" />
        </div>
        <div class="field" style="flex: 1;">
          <label for="reg-pronouns">Pronouns</label>
          <input type="text" id="reg-pronouns" name="pronouns" placeholder="they/them" />
        </div>
      </div>

      <div class="field">
        <label for="reg-gender">Gender</label>
        <input type="text" id="reg-gender" name="gender" placeholder="e.g. Female, Male, Non-binary" />
      </div>

      <div class="field">
        <label for="reg-instagram">Instagram Handle</label>
        <input type="text" id="reg-instagram" name="instagram_handle" placeholder="e.g. your_instagram_id" />
      </div>

      <div class="field">
        <label for="reg-avatar">Profile Photo</label>
        <input type="file" id="reg-avatar" name="avatar" accept="image/*" style="padding: 6px 12px; background: #FBF6E8;" />
      </div>

      <button type="submit" class="btn btn-brass" style="width: 100%; margin-top: 15px; text-shadow: none;">Create Card</button>
    </form>

      <!-- Google Sign-In -->
      <div id="google-signin-wrap" style="display: none; margin-top: 20px; text-align: center;">
        <div style="position: relative; margin-bottom: 16px;">
          <hr style="border: none; border-top: 2px solid var(--ink); opacity: 0.15; margin: 0;" />
          <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--surface); padding: 0 12px; font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-body);">or</span>
        </div>
        <a href="/auth/google" class="btn-google-signin" style="display: inline-flex; align-items: center; gap: 10px; padding: 10px 24px; background: #fff; border: 2px solid var(--ink); border-radius: 4px; font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); transition: all 0.15s ease;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Sign in with Google
        </a>
      </div>

    <a href="login.html" class="card-back-link">Already have a card? Log in →</a>
    <a href="index.html" class="card-back-link">Just here to read? Go back to the shelf →</a>
  </div>
</div>

<script src="js/profile-card.js"></script>
<script src="js/auth-nav.js"></script>
<script src="js/theme-toggle.js"></script>
<script src="js/auth-buttons.js"></script>
<script src="js/audio-helper.js"></script>
</body>
</html>
